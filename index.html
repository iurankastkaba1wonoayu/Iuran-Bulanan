<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Iuran Bulanan TK Aba 1 Wonoayu</title>
<style>
  :root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
    --bg:#f5f6fa; --card:#ffffff; --text:#1f2937; --muted:#6b7280; --line:#e5e7eb; --accent:#15803d; --ok:#16a34a; --bad:#dc2626; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#0f172a; --card:#1e293b; --text:#e2e8f0; --muted:#94a3b8; --line:#334155; --accent:#4ade80; --ok:#4ade80; --bad:#f87171; }
  }
  :root[data-theme="dark"] { --bg:#0f172a; --card:#1e293b; --text:#e2e8f0; --muted:#94a3b8; --line:#334155; --accent:#4ade80; --ok:#4ade80; --bad:#f87171; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--text); color-scheme: light dark; }
  main { max-width: 960px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.5rem; margin: 8px 0 16px; }
  h2 { font-size: 1.1rem; margin: 0 0 12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
  .grid { display:grid; gap:12px; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
  .stat small { color:var(--muted); }
  .stat div { font-size:1.2rem; font-weight:600; margin-top:4px; }
  form { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  input { padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--text); font-size:0.95rem; }
  input[type=number] { width: 130px; }
  input[type=text] { flex:1; min-width:160px; }
  button { padding:8px 14px; border:0; border-radius:8px; background:var(--accent); color:#fff; cursor:pointer; font-size:0.9rem; }
  button.ghost { background:transparent; color:var(--bad); border:1px solid var(--line); }
  .table-wrap { overflow-x:auto; }
  table { border-collapse: collapse; width:100%; font-size:0.9rem; }
  th, td { padding:8px; border-bottom:1px solid var(--line); text-align:center; white-space:nowrap; }
  th:nth-child(2), td:nth-child(2) { text-align:left; }
  td.nama { text-align:left; }
  input[type=checkbox] { width:18px; height:18px; cursor:pointer; }
  .lunas { color:var(--ok); font-weight:600; }
  .nunggak { color:var(--bad); font-weight:600; }
  .muted { color:var(--muted); font-size:0.85rem; }
  .row-actions { display:flex; justify-content:space-between; align-items:center; margin-top:12px; flex-wrap:wrap; gap:8px; }
</style>
</head>
<body>
<main>
  <h1>💰 Iuran Bulanan TK Aba 1 Wonoayu</h1>

  <div class="card">
    <h2>Pengaturan</h2>
    <form id="formSetting">
      <label class="muted">Iuran per bulan (Rp)</label>
      <input type="number" id="nominal" min="0" step="500">
      <label class="muted">Jumlah bulan</label>
      <input type="number" id="minggu" min="1" max="12" step="1">
      <button type="submit">Simpan</button>
    </form>
  </div>

  <div class="card">
    <div class="grid">
      <div class="stat"><small>Saldo kas</small><div id="saldo">-</div></div>
      <div class="stat"><small>Total pemasukan</small><div id="masuk">-</div></div>
      <div class="stat"><small>Total pengeluaran</small><div id="keluar">-</div></div>
      <div class="stat"><small>Siswa belum lunas</small><div id="belumLunas">-</div></div>
    </div>
  </div>

  <div class="card">
    <h2>Daftar Siswa &amp; Iuran</h2>
    <form id="formSiswa">
      <input type="text" id="namaBaru" placeholder="Nama siswa" required>
      <select id="kelompokBaru"><option value="KB">KB</option><option value="Kelompok A">Kelompok A</option><option value="Kelompok B">Kelompok B</option></select>
      <button type="submit">Tambah siswa</button>
    </form>
    <div class="table-wrap" style="margin-top:12px">
      <table>
        <thead><tr id="headRow"><th>No</th><th>Nama</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <p class="muted" id="kosong" style="display:none">Belum ada siswa. Tambahkan siswa di atas.</p>
  </div>

  <div class="card">
    <h2>Pengeluaran Kas</h2>
    <form id="formKeluar">
      <input type="text" id="ketKeluar" placeholder="Keterangan, misal: beli spidol" required>
      <input type="number" id="jumlahKeluar" placeholder="Jumlah (Rp)" min="1" required>
      <button type="submit">Catat</button>
    </form>
    <div class="table-wrap" style="margin-top:12px">
      <table>
        <thead><tr><th>Tanggal</th><th>Keterangan</th><th>Jumlah</th><th></th></tr></thead>
        <tbody id="tbodyKeluar"></tbody>
      </table>
    </div>
  </div>

  <div class="row-actions">
    <span class="muted">Data tersimpan otomatis di perangkat ini.</span>
    <button class="ghost" id="reset">Reset semua data</button>
  </div>
</main>

<script>
  const KEY = 'kas-kelas-v1';
  const rupiah = n => 'Rp ' + Number(n || 0).toLocaleString('id-ID');
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  let data = { nominal: 2000, minggu: 12, siswa: [], keluar: [] };

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) data = Object.assign(data, JSON.parse(raw));
    } catch (e) { /* penyimpanan tidak tersedia, pakai data kosong */ }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {}
  }

  function totalMasuk() {
    let n = 0;
    data.siswa.forEach(s => { n += Object.values(s.bayar).filter(Boolean).length; });
    return n * data.nominal;
  }
  function totalKeluar() { return data.keluar.reduce((a, k) => a + Number(k.jumlah), 0); }

  const NAMA_BULAN = ['Juli','Agustus','September','Oktober','November','Desember','Januari','Februari','Maret','April','Mei','Juni'];
  const namaBulan = w => NAMA_BULAN[w - 1] || ('Bulan ' + w);

  const URUT_KELOMPOK = ['KB', 'Kelompok A', 'Kelompok B'];
  const DAFTAR_SISWA = [
    ['KB', ['Arsen', 'Azriel', 'Ayasha', 'Faaz', 'Fariz', 'Khalid', 'Rangga', 'Aghnia', 'Anak Us Recca', 'Cucu Us Laili']],
    ['Kelompok A', ['Andhara', 'Amri', 'Aqila', 'Fawaz', 'Juna', 'Radeva']],
    ['Kelompok B', ['Alfarizky', 'Dutha', 'Shaka', 'Syauqi', 'Umar', 'Yazid', 'Fahri', 'Khawla', 'Meyra', 'Lea', 'Aqil']]
  ];

  function seedSiswa() {
    try { if (localStorage.getItem('kas-seed-v1')) return; } catch (e) {}
    DAFTAR_SISWA.forEach(([kel, names]) => names.forEach(nama => {
      if (!data.siswa.some(s => s.nama === nama && s.kelompok === kel)) {
        data.siswa.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), nama, kelompok: kel, bayar: {} });
      }
    }));
    try { localStorage.setItem('kas-seed-v1', '1'); } catch (e) {}
    save();
  }

  const urutSiswa = () => [...data.siswa].sort((a, b) =>
    (URUT_KELOMPOK.indexOf(a.kelompok) + 1 || 99) - (URUT_KELOMPOK.indexOf(b.kelompok) + 1 || 99));

  function render() {
    document.getElementById('nominal').value = data.nominal;
    document.getElementById('minggu').value = data.minggu;

    const masuk = totalMasuk(), keluar = totalKeluar();
    document.getElementById('masuk').textContent = rupiah(masuk);
    document.getElementById('keluar').textContent = rupiah(keluar);
    const saldo = masuk - keluar;
    const saldoEl = document.getElementById('saldo');
    saldoEl.textContent = rupiah(saldo);
    saldoEl.className = saldo < 0 ? 'nunggak' : '';

    const target = data.minggu;
    const belum = data.siswa.filter(s => Object.values(s.bayar).filter(Boolean).length < target).length;
    document.getElementById('belumLunas').textContent = belum + ' dari ' + data.siswa.length;

    // header minggu
    let head = '<th>No</th><th>Nama</th><th>Kelompok</th>';
    for (let w = 1; w <= data.minggu; w++) head += '<th>' + namaBulan(w) + '</th>';
    head += '<th>Total</th><th>Status</th><th></th>';
    document.getElementById('headRow').innerHTML = head;

    // baris siswa
    const tb = document.getElementById('tbody');
    tb.innerHTML = urutSiswa().map((s, i) => {
      let cells = '';
      for (let w = 1; w <= data.minggu; w++) {
        const checked = s.bayar[w] ? 'checked' : '';
        cells += '<td><input type="checkbox" data-siswa="' + s.id + '" data-minggu="' + w + '" ' + checked + '></td>';
      }
      const jumlahBayar = Object.values(s.bayar).filter(Boolean).length;
      const lunas = jumlahBayar >= data.minggu;
      const status = lunas ? '<span class="lunas">Lunas</span>'
        : '<span class="nunggak">Kurang ' + rupiah((data.minggu - jumlahBayar) * data.nominal) + '</span>';
      return '<tr><td>' + (i + 1) + '</td><td class="nama">' + esc(s.nama) + '</td><td>' + esc(s.kelompok || '-') + '</td>' + cells +
        '<td>' + rupiah(jumlahBayar * data.nominal) + '</td><td>' + status + '</td>' +
        '<td><button class="ghost" data-hapus-siswa="' + s.id + '">Hapus</button></td></tr>';
    }).join('');
    document.getElementById('kosong').style.display = data.siswa.length ? 'none' : 'block';

    // pengeluaran
    document.getElementById('tbodyKeluar').innerHTML = data.keluar.map(k =>
      '<tr><td>' + esc(k.tgl) + '</td><td class="nama" style="text-align:left">' + esc(k.ket) + '</td>' +
      '<td>' + rupiah(k.jumlah) + '</td><td><button class="ghost" data-hapus-keluar="' + k.id + '">Hapus</button></td></tr>'
    ).join('') || '<tr><td colspan="4" class="muted">Belum ada pengeluaran.</td></tr>';
  }

  document.getElementById('formSetting').addEventListener('submit', e => {
    e.preventDefault();
    data.nominal = Math.max(0, Number(document.getElementById('nominal').value) || 0);
    data.minggu = Math.min(12, Math.max(1, Number(document.getElementById('minggu').value) || 1));
    save(); render();
  });

  document.getElementById('formSiswa').addEventListener('submit', e => {
    e.preventDefault();
    const input = document.getElementById('namaBaru');
    const nama = input.value.trim();
    if (!nama) return;
    data.siswa.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), nama, kelompok: document.getElementById('kelompokBaru').value, bayar: {} });
    input.value = '';
    save(); render();
  });

  document.getElementById('formKeluar').addEventListener('submit', e => {
    e.preventDefault();
    const ket = document.getElementById('ketKeluar').value.trim();
    const jumlah = Number(document.getElementById('jumlahKeluar').value);
    if (!ket || !(jumlah > 0)) return;
    data.keluar.push({ id: Date.now().toString(36), ket, jumlah, tgl: new Date().toLocaleDateString('id-ID') });
    document.getElementById('ketKeluar').value = '';
    document.getElementById('jumlahKeluar').value = '';
    save(); render();
  });

  document.getElementById('tbody').addEventListener('change', e => {
    const cb = e.target;
    if (cb.type !== 'checkbox') return;
    const s = data.siswa.find(x => x.id === cb.dataset.siswa);
    if (!s) return;
    s.bayar[cb.dataset.minggu] = cb.checked;
    save(); render();
  });

  document.addEventListener('click', e => {
    const t = e.target;
    if (t.dataset.hapusSiswa) {
      if (!confirm('Hapus siswa ini beserta riwayat iurannya?')) return;
      data.siswa = data.siswa.filter(s => s.id !== t.dataset.hapusSiswa);
    } else if (t.dataset.hapusKeluar) {
      if (!confirm('Hapus catatan pengeluaran ini?')) return;
      data.keluar = data.keluar.filter(k => k.id !== t.dataset.hapusKeluar);
    } else if (t.id === 'reset') {
      if (!confirm('Yakin hapus semua data kas?')) return;
      data = { nominal: 2000, minggu: 12, siswa: [], keluar: [] };
    } else return;
    save(); render();
  });

  load();
  seedSiswa();
  render();
</script>
</body>
</html>
